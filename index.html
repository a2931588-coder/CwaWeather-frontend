<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>恰恰報氣象 - 像素貓咪風</title>

    <style>
        /* ------------------------------
           🟩 像素貓咪主題配色
        ------------------------------ */
        :root {
            --px-green: #8bd8a1;
            --px-dark: #4a403d;
            --px-light: #fff8e6;
            --px-yellow: #f6e98a;
            --px-border: #2c2c2c;
            --px-card: #fdfaf2;
            --px-blue: #7dc7ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        /* ------------------------------ */
        body {
            font-family: "Courier New", monospace;
            background-color: var(--px-green);
            background-image:
                repeating-linear-gradient(
                    0deg,
                    rgba(255,255,255,0.15) 0px,
                    rgba(255,255,255,0.15) 2px,
                    transparent 2px,
                    transparent 4px
                );
            min-height: 100vh;
            color: var(--px-dark);
            overflow-x: hidden;
            padding-bottom: 20px;
        }

        /* ------------------------------
           🟥 共用像素邊框樣式
        ------------------------------ */
        .px-border {
            border: 3px solid var(--px-border);
            box-shadow:
                0 0 0 3px #ffffff80,
                4px 4px 0 #00000030;
        }

        /* ------------------------------
           🔵 上方狀態列
        ------------------------------ */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: #ffffff50;
            backdrop-filter: blur(4px);
            position: sticky;
            top: 0;
            z-index: 100;
            font-weight: bold;
        }

        .location-pill {
            background: var(--px-yellow);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 1.1rem;
            border: 3px solid var(--px-border);
            box-shadow: 2px 2px 0 var(--px-border);
        }

        .update-pill {
            font-size: 0.8rem;
            background: #00000020;
            padding: 4px 10px;
            border-radius: 4px;
            color: white;
        }

        /* ------------------------------
           🟦 主容器
        ------------------------------ */
        .container {
            padding: 20px;
            max-width: 640px;
            margin: 0 auto;
        }

        /* ------------------------------
           🌤 Hero Card (像素貓咪版)
        ------------------------------ */
        .hero-card {
            background: var(--px-card);
            padding: 30px 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            position: relative;
        }

        .hero-period {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--px-blue);
            padding: 5px 20px;
            border-radius: 6px;
            font-weight: bold;
            border: 3px solid var(--px-border);
            font-size: 1.1rem;
            box-shadow: 2px 2px 0 var(--px-border);
            color: white;
        }

        .hero-temp-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 20px 0;
        }

        /* 像素風天氣Emoji — 貓咪版本 */
        .hero-icon {
            font-size: 4.2rem;
            line-height: 1;
            animation: pxBounce 3s infinite;
        }

        @keyframes pxBounce {
            0% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
            100% { transform: translateY(0); }
        }

        .hero-temp {
            font-size: 4rem;
            font-weight: 900;
            color: var(--px-dark);
        }

        .hero-desc {
            font-size: 1.4rem;
            margin-bottom: 15px;
            font-weight: bold;
        }

        /* ------------------------------
           🟪 快速建議區 (像素按鈕)
        ------------------------------ */
        .advice-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            padding-top: 20px;
            border-top: 2px dashed var(--px-border);
        }

        .advice-item {
            text-align: center;
            background: #ffffffaa;
            padding: 12px;
            border-radius: 8px;
            border: 3px solid var(--px-border);
            box-shadow: 2px 2px 0 var(--px-border);
        }

        .advice-icon {
            font-size: 1.8rem;
            margin-bottom: 4px;
        }

        .advice-text {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 3px;
        }

        /* ------------------------------
           🟧 稍後預報 (像素卡片)
        ------------------------------ */
        .section-title {
            font-size: 1.2rem;
            margin-bottom: 12px;
            margin-left: 5px;
            font-weight: 900;
            color: white;
            text-shadow: 2px 2px 0 var(--px-border);
        }

        .scroll-container {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .scroll-container::-webkit-scrollbar { display: none; }

        .mini-card {
            background: #ffffffd0;
            padding: 16px;
            min-width: 120px;
            border-radius: 10px;
            border: 3px solid var(--px-border);
            box-shadow: 2px 2px 0 var(--px-border);
            text-align: center;
        }

        .mini-time {
            background: var(--px-yellow);
            padding: 3px 6px;
            font-size: 0.75rem;
            border-radius: 4px;
            border: 2px solid var(--px-border);
            display: inline-block;
        }

        .mini-icon {
            margin-top: 6px;
            font-size: 2rem;
        }

        .mini-temp {
            font-size: 1rem;
            font-weight: bold;
            margin-top: 4px;
        }

        /* ------------------------------
           🟩 像素 Loading 畫面
        ------------------------------ */
        .loading-screen {
            position: fixed;
            inset: 0;
            background: var(--px-green);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 999;
            font-family: "Courier New", monospace;
        }

        .px-cloud {
            font-size: 3.5rem;
            animation: pxBounce 1.6s infinite;
        }

        .px-loading-cat {
            margin-top: 10px;
            font-size: 2rem;
        }
    </style>
</head>

<body>

    <!-- =======================
         🟩 Loading 畫面
         ======================= -->
    <div id="loading" class="loading-screen">
        <div class="px-cloud">░🌧░</div>
        <div class="px-loading-cat">=＾● ⋏ ●＾=</div>
        <p style="margin-top: 15px; color: white; font-size: 1rem;">
            正在觀測貓貓雲朵流動...
        </p>
    </div>

    <!-- =======================
         🔵 頂部列
         ======================= -->
    <div class="status-bar">
        <div class="location-pill">🐾 臺中</div>
        <div id="updateTime" class="update-pill">更新中...</div>
    </div>

    <!-- =======================
         🟦 主內容
         ======================= -->
    <div class="container" id="mainContent" style="display:none;">

        <div id="heroCard"></div>

        <h3 class="section-title">稍後預報（喵）</h3>
        <div class="scroll-container" id="futureForecasts"></div>
    </div>

    <script>
        /* ------------------------------
           🐱 像素貓咪天氣圖示
        ------------------------------ */
        function catWeatherIcon(weather) {
            if (!weather) return "＝＾● ⋏ ●＾＝";

            if (weather.includes("晴")) return "😺☀";
            if (weather.includes("多雲")) return "😺☁";
            if (weather.includes("陰")) return "😺░☁";
            if (weather.includes("雨")) return "😺🌧";
            if (weather.includes("雷")) return "😺⚡";

            return "😺☀";
        }

        /* ------------------------------ */
        const API_URL = "https://nice-weather.zeabur.app/api/weather/kaohsiung";

        function getAdvice(rainProb, maxTemp) {
            let rainIcon = "🐾";
            let rainText = "不太會下雨喵";
            if (parseInt(rainProb) > 30) {
                rainIcon = "💧";
                rainText = "可能會變濕濕喵";
            }

            let clothIcon = "🐱";
            let clothText = "正常穿著喵";
            if (parseInt(maxTemp) >= 28) {
                clothIcon = "🔥";
                clothText = "會熱到融化喵";
            } else if (parseInt(maxTemp) <= 20) {
                clothIcon = "🧣";
                clothText = "要暖暖的喵";
            }

            return { rainIcon, rainText, clothIcon, clothText };
        }

        function getTimePeriod(startTime) {
            const hour = new Date(startTime).getHours();
            if (hour >= 5 && hour < 11) return "早晨";
            if (hour >= 11 && hour < 14) return "中午";
            if (hour >= 14 && hour < 18) return "下午";
            if (hour >= 18 && hour < 23) return "晚上";
            return "深夜";
        }

        /* ------------------------------ */
        function renderWeather(data) {
            const forecasts = data.forecasts;
            const current = forecasts[0];
            const others = forecasts.slice(1);

            const advice = getAdvice(current.rain, current.maxTemp);
            const period = getTimePeriod(current.startTime);
            const avgTemp = Math.round((parseInt(current.maxTemp) + parseInt(current.minTemp)) / 2);

            document.getElementById('heroCard').innerHTML = `
                <div class="hero-card px-border">
                    <div class="hero-period">${period}</div>

                    <div class="hero-temp-container">
                        <div class="hero-icon">${catWeatherIcon(current.weather)}</div>
                        <div class="hero-temp">${avgTemp}°</div>
                    </div>

                    <div class="hero-desc">${current.weather}</div>

                    <div class="advice-grid">
                        <div class="advice-item">
                            <div class="advice-icon">${advice.rainIcon}</div>
                            <div class="advice-text">${advice.rainText}</div>
                            <div style="font-size:0.75rem; color:#555;">降雨 ${current.rain}%</div>
                        </div>
                        <div class="advice-item">
                            <div class="advice-icon">${advice.clothIcon}</div>
                            <div class="advice-text">${advice.clothText}</div>
                            <div style="font-size:0.75rem; color:#555;">高溫 ${current.maxTemp}°</div>
                        </div>
                    </div>
                </div>
            `;

            const scrollContainer = document.getElementById('futureForecasts');
            scrollContainer.innerHTML = '';

            const today = new Date().getDate();

            others.forEach(f => {
                let label = getTimePeriod(f.startTime);
                const fDate = new Date(f.startTime).getDate();
                if (fDate !== today) label = "明天" + label;

                scrollContainer.innerHTML += `
                    <div class="mini-card">
                        <div class="mini-time">${label}</div>
                        <div class="mini-icon">${catWeatherIcon(f.weather)}</div>
                        <div class="mini-temp">${f.minTemp}° - ${f.maxTemp}°</div>
                        <div style="font-size:0.8rem; color:#666; margin-top:5px;">💧${f.rain}%</div>
                    </div>
                `;
            });

            const now = new Date();
            const days = ["週日","週一","週二","週三","週四","週五","週六"];
            document.getElementById('updateTime').textContent =
                `${now.getMonth()+1}月${now.getDate()}日 ${days[now.getDay()]}`;
        }

        /* ------------------------------ */
        async function fetchWeather() {
            try {
                const delay = new Promise(r => setTimeout(r, 1500));
                const data = fetch(API_URL).then(res => res.json());
                const [, json] = await Promise.all([delay, data]);

                if (json.success) {
                    renderWeather(json.data);
                    document.getElementById('loading').style.display = "none";
                    document.getElementById('mainContent').style.display = "block";
                }
            } catch (e) {
                alert("喵嗚！天氣資料抓不到！");
            }
        }

        document.addEventListener("DOMContentLoaded", fetchWeather);
    </script>
</body>
</html>
